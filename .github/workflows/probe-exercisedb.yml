name: Probe ExerciseDB sources

on:
  push:
    paths:
      - 'routine-motion/.exercise-probe-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live API and static mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p routine-motion
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re
          report={'live_api':{},'static':{'matches':{}},'errors':[]}
          # Live API probe
          live='https://oss.exercisedb.dev/api/v1/exercises?limit=100'
          try:
              req=urllib.request.Request(live,headers={'User-Agent':'B-Routine-Probe/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  payload=json.loads(r.read().decode('utf-8'))
              report['live_api']={'status':200,'shape':'array' if isinstance(payload,list) else 'object','count':len(payload if isinstance(payload,list) else (payload.get('data') or payload.get('exercises') or []))}
          except Exception as e:
              report['live_api']={'error':repr(e)}
          # Static dataset mirror, used only to identify exact ExerciseDB IDs and media paths.
          static_url='https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json'
          req=urllib.request.Request(static_url,headers={'User-Agent':'B-Routine-Probe/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:
              rows=json.loads(r.read().decode('utf-8'))
          report['static']['total_loaded']=len(rows)
          wants={
            'pushup':{'queries':['push up','push-up'],'equipment':['body weight'],'targets':['pectorals','chest']},
            'pushup-close':{'queries':['diamond push up','close grip push up','narrow push up'],'equipment':['body weight'],'targets':['triceps','pectorals']},
            'row':{'queries':['one arm dumbbell row','dumbbell bent over row','bent over row'],'equipment':['dumbbell','kettlebell'],'targets':['back','lats','upper back']},
            'deadlift':{'queries':['kettlebell deadlift','dumbbell deadlift','romanian deadlift'],'equipment':['kettlebell','dumbbell'],'targets':['glutes','hamstrings']},
            'squat':{'queries':['goblet squat','dumbbell goblet squat','kettlebell goblet squat'],'equipment':['dumbbell','kettlebell'],'targets':['quads','glutes']},
            'lunge':{'queries':['reverse lunge','dumbbell reverse lunge','kettlebell reverse lunge'],'equipment':['dumbbell','kettlebell','body weight'],'targets':['quads','glutes']},
            'shoulder-press':{'queries':['kettlebell press','dumbbell shoulder press','dumbbell overhead press'],'equipment':['kettlebell','dumbbell'],'targets':['delts','shoulders']},
            'lateral-raise':{'queries':['dumbbell lateral raise','lateral raise'],'equipment':['dumbbell','resistance band'],'targets':['delts','shoulders']},
            'face-pull':{'queries':['rear delt fly','reverse fly','rear delt'],'equipment':['dumbbell','resistance band','cable'],'targets':['delts','shoulders']},
            'curl':{'queries':['dumbbell biceps curl','dumbbell curl','biceps curl'],'equipment':['dumbbell','kettlebell'],'targets':['biceps']},
            'triceps':{'queries':['dumbbell overhead triceps extension','overhead triceps extension','triceps extension'],'equipment':['dumbbell','kettlebell'],'targets':['triceps']}
          }
          avoid=['wall','assisted','chair','seated','stretch','mobility','rehab','physio','isometric','knee push','incline push']
          def norm(s): return re.sub(r'[^a-z0-9]+',' ',str(s or '').lower()).strip()
          for key,pref in wants.items():
              scored=[]
              for ex in rows:
                  name=norm(ex.get('name')); equip=norm(ex.get('equipment')); target=norm(ex.get('target')); body=norm(ex.get('body_part')); secondary=' '.join(norm(x) for x in ex.get('secondary_muscles',[]))
                  score=0
                  for qi,q in enumerate(pref['queries']):
                      qn=norm(q); toks=[x for x in qn.split() if x]; hits=sum(1 for x in toks if x in name)
                      if hits==len(toks): score=max(score,100-qi*7+(35 if name==qn else 0))
                      else: score=max(score,hits*9-qi*2)
                  if any(norm(e) in equip or equip in norm(e) for e in pref['equipment']): score+=20
                  muscles=' '.join([target,body,secondary])
                  if any(norm(t) in muscles for t in pref['targets']): score+=14
                  for bad in avoid:
                      if bad in name and bad not in ' '.join(norm(q) for q in pref['queries']): score-=90
                  if ex.get('gif_url'): score+=5
                  scored.append((score,ex))
              scored.sort(key=lambda x:(-x[0],x[1].get('name','')))
              report['static']['matches'][key]=[{
                  'score':s,'id':ex.get('id'),'exerciseId':ex.get('media_id'),'name':ex.get('name'),'equipment':ex.get('equipment'),'target':ex.get('target'),'body_part':ex.get('body_part'),'secondary_muscles':ex.get('secondary_muscles'),'gif_url':ex.get('gif_url'),'attribution':ex.get('attribution')
              } for s,ex in scored[:15]]
          open('routine-motion/exercisedb-probe.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit probe result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routine-motion/exercisedb-probe.json
          git diff --cached --quiet || git commit -m 'chore: capture ExerciseDB source probe [skip ci]'
          git push
