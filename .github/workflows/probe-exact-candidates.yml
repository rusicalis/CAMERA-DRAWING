name: Probe exact exercise candidates

on:
  push:
    paths:
      - 'routine-motion/.exercise-exact-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find exact candidates
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json'
          req=urllib.request.Request(url,headers={'User-Agent':'B-Routine-Probe/1.0'})
          rows=json.loads(urllib.request.urlopen(req,timeout=60).read().decode())
          def slim(ex): return {k:ex.get(k) for k in ['id','name','equipment','target','body_part','secondary_muscles','media_id','gif_url','attribution']}
          def find_text(*phrases):
              out=[]
              for ex in rows:
                  n=ex.get('name','').lower()
                  if any(p in n for p in phrases): out.append(slim(ex))
              return out[:80]
          report={
            'standing_extension':find_text('standing one arm extension','standing triceps extension','one arm extension','overhead triceps extension'),
            'ids_0420_0430':[slim(ex) for ex in rows if ex.get('id','') in {f'{i:04d}' for i in range(420,431)}]
          }
          open('routine-motion/exercisedb-exact-candidates.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routine-motion/exercisedb-exact-candidates.json
          git diff --cached --quiet || git commit -m 'chore: capture triceps exact candidates [skip ci]'
          git push
