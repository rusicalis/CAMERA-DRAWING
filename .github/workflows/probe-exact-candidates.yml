name: Probe exact exercise candidates

on:
  push:
    paths:
      - 'routine-motion/.exercise-exact-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find exact candidates
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json'
          req=urllib.request.Request(url,headers={'User-Agent':'B-Routine-Probe/1.0'})
          rows=json.loads(urllib.request.urlopen(req,timeout=60).read().decode())
          def pick(pred):
              out=[]
              for ex in rows:
                  n=ex.get('name','').lower()
                  if pred(n,ex):
                      out.append({k:ex.get(k) for k in ['id','name','equipment','target','body_part','secondary_muscles','media_id','gif_url','attribution']})
              return out[:40]
          report={
            'lunge_all':pick(lambda n,e:'lunge' in n and e.get('equipment') in ['body weight','dumbbell','kettlebell']),
            'kettlebell_deadlift':pick(lambda n,e:'kettlebell' in n and ('deadlift' in n or 'dead lift' in n)),
            'kettlebell_squat':pick(lambda n,e:'kettlebell' in n and 'squat' in n),
            'kettlebell_shoulder_press':pick(lambda n,e:'kettlebell' in n and ('military press' in n or 'overhead press' in n or 'alternating press' in n)),
            'band_lateral_raise':pick(lambda n,e:('band' in n or e.get('equipment')=='band') and 'lateral raise' in n),
            'band_reverse_fly':pick(lambda n,e:('band' in n or e.get('equipment')=='band') and ('reverse fly' in n or 'rear delt fly' in n)),
            'kettlebell_curl':pick(lambda n,e:'kettlebell' in n and 'curl' in n),
            'dumbbell_overhead_triceps':pick(lambda n,e:e.get('equipment')=='dumbbell' and 'triceps' in n and ('overhead' in n or 'standing' in n or 'extension' in n)),
            'one_arm_row':pick(lambda n,e:('one arm' in n or 'single arm' in n) and 'row' in n and e.get('equipment') in ['dumbbell','kettlebell'])
          }
          open('routine-motion/exercisedb-exact-candidates.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routine-motion/exercisedb-exact-candidates.json
          git diff --cached --quiet || git commit -m 'chore: capture exact exercise candidates [skip ci]'
          git push
