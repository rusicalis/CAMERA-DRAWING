name: Discover Vital Free Pack URL

on:
  push:
    paths:
      - 'routine-motion/.vital-probe'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe official free-pack app bundle
        run: |
          python - <<'PY'
          import re, urllib.request, html as h, urllib.parse
          headers={'User-Agent':'Mozilla/5.0'}
          page=urllib.request.urlopen(urllib.request.Request('https://vitalanimations.com/free-pack',headers=headers),timeout=30).read().decode('utf-8','replace')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I)
          out=['# Vital free-pack bundle probe']
          for src in scripts:
              url=urllib.parse.urljoin('https://vitalanimations.com/free-pack',src)
              out += ['','## Script '+url]
              try:
                  js=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30).read().decode('utf-8','replace')
                  candidates=set()
                  for pat in [r'https?://[^"\'` <>]+', r'["\']([^"\']*(?:zip|download|free.?pack|supabase|storage|cloudfront|r2|s3)[^"\']*)["\']']:
                      for m in re.findall(pat,js,re.I):
                          s=m if isinstance(m,str) else m[0]
                          if len(s)<1000: candidates.add(h.unescape(s))
                  out += sorted(candidates)
                  for m in re.finditer(r'.{0,180}(?:Download Free Pack|downloadFree|freePack|\.zip).{0,260}',js,re.I|re.S):
                      s=re.sub(r'\s+',' ',m.group(0)).strip()
                      if len(s)<1000: out.append('CTX: '+s)
              except Exception as e:
                  out.append('ERROR: '+repr(e))
          open('routine-motion/VITAL_PROBE.txt','w').write('\n'.join(out)+'\n')
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routine-motion/VITAL_PROBE.txt
          git commit -m 'chore: probe Vital app bundle [skip ci]' || exit 0
          git push
