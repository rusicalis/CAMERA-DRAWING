name: Discover Vital Free Pack URL

on:
  push:
    paths:
      - 'routine-motion/.vital-probe'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe official free-pack page
        run: |
          python - <<'PY'
          import re, urllib.request
          req=urllib.request.Request('https://vitalanimations.com/free-pack',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          urls=[]
          for pat in [r'https?://[^"\'<> ]+', r'(?:href|src)=["\']([^"\']+)["\']']:
              for m in re.findall(pat,html,re.I):
                  u=m if isinstance(m,str) else m[0]
                  if any(k in u.lower() for k in ('zip','download','free','pack','storage','cdn')):
                      urls.append(u)
          out=['# Vital free-pack link probe','','## Candidates']+sorted(set(urls))+['','## HTML size',str(len(html))]
          open('routine-motion/VITAL_PROBE.txt','w').write('\n'.join(out)+'\n')
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routine-motion/VITAL_PROBE.txt
          git commit -m 'chore: probe Vital free pack link [skip ci]' || exit 0
          git push
