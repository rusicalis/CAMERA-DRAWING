name: Discover Vital Free Pack URL

on:
  push:
    paths:
      - 'routine-motion/.vital-probe'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe official free-pack app bundle
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          H={'User-Agent':'Mozilla/5.0'}
          page=urllib.request.urlopen(urllib.request.Request('https://vitalanimations.com/free-pack',headers=H),timeout=30).read().decode('utf-8','replace')
          src=re.search(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I).group(1)
          url=urllib.parse.urljoin('https://vitalanimations.com/free-pack',src)
          js=urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=30).read().decode('utf-8','replace')
          out=['# Vital free-pack focused probe','SCRIPT='+url]
          urls=sorted(set(re.findall(r'https?://[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]+',js)))
          out.append('## FILTERED URLS')
          out.extend(u for u in urls if any(k in u.lower() for k in ['firebase','storage','zip','download','vitalanimation','googleapis']))
          out.append('## STRING CANDIDATES')
          strings=re.findall(r'(["\'`])(.{0,700}?)\1',js,re.S)
          keep=[]
          for _,s in strings:
              lo=s.lower()
              if any(k in lo for k in ['.zip','getdownloadurl','download now','download started','starting download','free50','free-pack.zip','storagebucket']):
                  s=re.sub(r'\s+',' ',s).strip()
                  if s and s not in keep: keep.append(s)
          out.extend(keep[:120])
          out.append('## CONTEXT')
          for key in ['Download Now','Starting download','Download started','getDownloadURL','.zip','storageBucket']:
              out.append('KEY='+key)
              for m in list(re.finditer(re.escape(key),js,re.I))[:8]:
                  s=re.sub(r'\s+',' ',js[max(0,m.start()-350):m.end()+550])
                  out.append(s)
          open('routine-motion/VITAL_PROBE.txt','w').write('\n'.join(out)+'\n')
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routine-motion/VITAL_PROBE.txt
          git commit -m 'chore: focused probe Vital free pack [skip ci]' || exit 0
          git push
