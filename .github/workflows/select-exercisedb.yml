name: Select ExerciseDB exact motions

on:
  push:
    paths:
      - 'routine-motion/.exercise-select-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract top exact matches
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('routine-motion/exercisedb-probe.json'))
          matches=p['static']['matches']
          selected={k:(v[0] if v else None) for k,v in matches.items()}
          open('routine-motion/exercisedb-selected.json','w').write(json.dumps(selected,ensure_ascii=False,indent=2))
          PY
      - name: Commit selection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routine-motion/exercisedb-selected.json
          git diff --cached --quiet || git commit -m 'chore: save exact ExerciseDB selections [skip ci]'
          git push
